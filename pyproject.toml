[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-web-mcp"
version = "1.1.2"
description = "Local MCP and Chromium extension bridge for ChatGPT and GLM web text and vision"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "mcp>=1.0,<2.0",
]

[project.scripts]
ai-web-bridge = "ai_web_mcp.bridge:main"
ai-web-mcp = "ai_web_mcp.mcp_server:main"
gpt-web-bridge = "ai_web_mcp.bridge:main"
gpt-web-mcp = "ai_web_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
